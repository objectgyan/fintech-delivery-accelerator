name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  PLACEHOLDER_IMAGE: placeholder
  PAYMENT_IMAGE: payment

jobs:
  build-and-test:
    name: Build, Test & Dockerize
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore — placeholder
        run: dotnet restore services/placeholder/Placeholder/Placeholder.csproj

      - name: Build — placeholder
        run: dotnet build services/placeholder/Placeholder/Placeholder.csproj -c Release --no-restore

      - name: Restore — payment
        run: dotnet restore services/payment/Payment.Api/Payment.Api.csproj

      - name: Build — payment
        run: dotnet build services/payment/Payment.Api/Payment.Api.csproj -c Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal || echo "No tests yet"

      - name: Azure Login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.ref == 'refs/heads/main'
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Docker Build & Push — placeholder
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PLACEHOLDER_IMAGE }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.PLACEHOLDER_IMAGE }}:latest \
                       services/placeholder
          docker push ${{ env.REGISTRY }}/${{ env.PLACEHOLDER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PLACEHOLDER_IMAGE }}:latest

      - name: Docker Build & Push — payment
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PAYMENT_IMAGE }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.PAYMENT_IMAGE }}:latest \
                       services/payment
          docker push ${{ env.REGISTRY }}/${{ env.PAYMENT_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PAYMENT_IMAGE }}:latest
