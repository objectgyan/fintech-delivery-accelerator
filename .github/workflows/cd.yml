name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: ${{ secrets.ACA_RESOURCE_GROUP }}

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy payment service
        run: |
          az containerapp secret set \
            --name ${{ secrets.ACA_PAYMENT_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "sb-connection-string=${{ secrets.PAYMENT_SB_CONNECTION_STRING }}" \
              "sql-connection-string=${{ secrets.PAYMENT_SQL_CONNECTION_STRING }}" \
              "stripe-secret-key=${{ secrets.PAYMENT_STRIPE_SECRET_KEY }}"
          az containerapp update \
            --name ${{ secrets.ACA_PAYMENT_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/payment:${{ github.event.workflow_run.head_sha }} \
            --set-env-vars \
              "ServiceBus__ConnectionString=secretref:sb-connection-string" \
              "ConnectionStrings__Payments=secretref:sql-connection-string" \
              "Stripe__SecretKey=secretref:stripe-secret-key"

      - name: Deploy notification worker
        run: |
          az containerapp secret set \
            --name ${{ secrets.ACA_NOTIFICATION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "sb-connection-string=${{ secrets.PAYMENT_SB_CONNECTION_STRING }}"
          az containerapp update \
            --name ${{ secrets.ACA_NOTIFICATION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/notification:${{ github.event.workflow_run.head_sha }} \
            --set-env-vars \
              "ServiceBus__ConnectionString=secretref:sb-connection-string"

      - name: Verify payment revision
        run: |
          az containerapp revision list \
            --name ${{ secrets.ACA_PAYMENT_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output table

      - name: Verify notification revision
        run: |
          az containerapp revision list \
            --name ${{ secrets.ACA_NOTIFICATION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output table

      - name: Deploy fraud service
        run: |
          az containerapp update \
            --name ${{ secrets.ACA_FRAUD_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/fraud:${{ github.event.workflow_run.head_sha }} \
            --set-env-vars \
              "ASPNETCORE_HTTP_PORTS=8080" \
              "APPLICATIONINSIGHTS_CONNECTION_STRING=${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}"

      - name: Verify fraud revision
        run: |
          az containerapp revision list \
            --name ${{ secrets.ACA_FRAUD_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output table
